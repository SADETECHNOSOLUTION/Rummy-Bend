eureka:
  client:
    service-url:
      defaultZone: https://rummy-eureka-v1.onrender.com/eureka/
    fetch-registry: true
    register-with-eureka: true
    instance:
      # Forces the public identity in Eureka
      instance-id: ${spring.application.name}:${random.value}
      hostname: rummy-apigateway-v1
      prefer-ip-address: false
      # Required for Render to route properly
      non-secure-port: ${server.port}
    
server:
  port: ${PORT:7070}
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForLocalDevelopment1234567890}

  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"


