spring:
  application:
    name: friend-request

  redis:
    host: localhost
    port: 6379

  data:
    mongodb:
      uri: mongodb+srv://sreemanvk:Msg2709@cluster0.pvohmlz.mongodb.net/?appName=Cluster0
      database: friend_list

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka
    fetch-registry: true
    register-with-eureka: true

server:
  port: 7083

  level:
    com.sadetech.room_creation: DEBUG
    org.springframework: ERROR
    feign: DEBUG
    org.hibernate: ERROR
    org.springframework.web: DEBUG
    org.springframework.http: DEBUG
    com.sadetech.room_creation.client: DEBUG
    org.springframework.cloud.openfeign: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

feign:
  client:
    config:
      default:
        loggerLevel: FULL